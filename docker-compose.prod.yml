# Продакшн-розгортання OpenBP (F4-10). Змінні — у .env (scripts/gen-env.sh створює його з .env.example з
# випадковими секретами). Запуск:  docker compose -f docker-compose.prod.yml up -d --build --wait
# Назовні відкритий лише web (OPENBP_HTTP_PORT); воркерів можна додати: --scale worker=3.
name: openbp-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-connection: &db-connection
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openbp};Username=${POSTGRES_USER:-openbp};Password=${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}"

x-app-env: &app-env
  <<: *db-connection
  OPENBP_ENCRYPTION_KEY: ${OPENBP_ENCRYPTION_KEY:?задайте OPENBP_ENCRYPTION_KEY у .env (scripts/gen-env.sh)}
  OPENBP_LOG_FORMAT: ${OPENBP_LOG_FORMAT:-json}
  OPENBP_MAX_EXECUTION_TIMEOUT_SEC: ${OPENBP_MAX_EXECUTION_TIMEOUT_SEC:-3600}
  OPENBP_DATA_TABLE_MAX_ROWS: ${OPENBP_DATA_TABLE_MAX_ROWS:-100000}
  OPENBP_DATA_TABLE_MAX_ROW_BYTES: ${OPENBP_DATA_TABLE_MAX_ROW_BYTES:-65536}
  TZ: ${TZ:-Europe/Kyiv}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbp}
      POSTGRES_USER: ${POSTGRES_USER:-openbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  # Застосовує міграції і завершується; api і worker стартують лише після успіху.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: openbp/migrate:${OPENBP_VERSION:-local}
    restart: "no"
    environment:
      <<: *db-connection
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: openbp/api:${OPENBP_VERSION:-local}
    restart: unless-stopped
    # OIDC-провайдери (OpenBp__Oidc__Providers__<key>__…, docs/admin/oidc.md): окремий файл, бо ключі довільні і є секрети.
    env_file:
      - path: ./oidc.env
        required: false
    environment:
      <<: *app-env
      OPENBP_ADMIN_EMAIL: ${OPENBP_ADMIN_EMAIL:-}
      OPENBP_ADMIN_PASSWORD: ${OPENBP_ADMIN_PASSWORD:-}
      # Публічна адреса (як її бачить браузер і зовнішні сервіси): redirect URI OAuth2, адреси webhook-ів.
      OPENBP_PUBLIC_URL: ${OPENBP_PUBLIC_URL:-}
      # Origin-и сторінок, що вбудовують редактор <openbp-canvas> (docs/embedding.md), через кому.
      OPENBP_CORS_ORIGINS: ${OPENBP_CORS_ORIGINS:-}
      # false — вхід паролем лише для OPENBP_ADMIN_EMAIL, решта входить через OIDC (F4-14, docs/admin/oidc.md).
      OPENBP_PASSWORD_LOGIN: ${OPENBP_PASSWORD_LOGIN:-true}
      OPENBP_EXECUTION_RETENTION_DAYS: ${OPENBP_EXECUTION_RETENTION_DAYS:-30}
      OPENBP_EXECUTION_RETENTION_CRON: ${OPENBP_EXECUTION_RETENTION_CRON:-0 0 3 * * ?}
      OPENBP_AUDIT_RETENTION_DAYS: ${OPENBP_AUDIT_RETENTION_DAYS:-365}
      # Сповіщення адміністратору (F6-07): період перевірки й розсилки, с; 0 — вимкнено.
      OPENBP_NOTIFICATIONS_INTERVAL_SEC: ${OPENBP_NOTIFICATIONS_INTERVAL_SEC:-30}
      OPENBP_METRICS_ALLOW_ANONYMOUS: ${OPENBP_METRICS_ALLOW_ANONYMOUS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: openbp/worker:${OPENBP_VERSION:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      # S3-сумісне сховище файлів (F6-18, docs/admin/README.md §10): задано бакет — нові файли йдуть у S3,
      # старі з тому files лишаються доступними. Порожньо — лише том files.
      Storage__S3__Endpoint: ${OPENBP_S3_ENDPOINT:-}
      Storage__S3__Bucket: ${OPENBP_S3_BUCKET:-}
      Storage__S3__Region: ${OPENBP_S3_REGION:-us-east-1}
      Storage__S3__AccessKey: ${OPENBP_S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${OPENBP_S3_SECRET_KEY:-}
      # Трейси OpenTelemetry (OTLP); порожньо — вимкнено.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-openbp-worker}
      # /metrics воркера (F6-07) без входу; типово — лише з API-ключем admin'а.
      OPENBP_METRICS_ALLOW_ANONYMOUS: ${OPENBP_METRICS_ALLOW_ANONYMOUS:-false}
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false
    logging: *logging

  # Власне S3-сховище (F6-18), лише з профілем s3:  docker compose -f docker-compose.prod.yml --profile s3 up -d --wait
  # Воркеру в .env: OPENBP_S3_ENDPOINT=http://minio:9000, OPENBP_S3_BUCKET, OPENBP_S3_ACCESS_KEY, OPENBP_S3_SECRET_KEY.
  # Офіційного образу minio/minio на Docker Hub більше немає — типово збірка MinIO від Bitnami (OPENBP_MINIO_IMAGE).
  minio:
    image: ${OPENBP_MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23}
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OPENBP_S3_ACCESS_KEY:-openbp}
      MINIO_ROOT_PASSWORD: ${OPENBP_S3_SECRET_KEY:-}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: openbp/web:${OPENBP_VERSION:-local}
    restart: unless-stopped
    environment:
      OPENBP_API_UPSTREAM: api:8080
    ports:
      - "${OPENBP_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Щоденний pg_dump -Fc у ./backups (OPENBP_BACKUP_DIR) з ротацією (F4-11). Разовий бекап: scripts/backup.sh,
  # відновлення: scripts/restore.sh <файл>. Ключ OPENBP_ENCRYPTION_KEY бекапте окремо — у дампі його немає.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: openbp/backup:${OPENBP_VERSION:-local}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-openbp}
      PGUSER: ${POSTGRES_USER:-openbp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}
      OPENBP_BACKUP_CRON: ${OPENBP_BACKUP_CRON:-0 2 * * *}
      OPENBP_BACKUP_KEEP_DAYS: ${OPENBP_BACKUP_KEEP_DAYS:-14}
      OPENBP_BACKUP_UID: ${OPENBP_BACKUP_UID:-0}
      OPENBP_BACKUP_GID: ${OPENBP_BACKUP_GID:-0}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ${OPENBP_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  files:
  minio-data:
