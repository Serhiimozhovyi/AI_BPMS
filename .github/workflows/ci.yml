name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Кеш NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      # Testcontainers (OpenBP.Data.Tests) використовує Docker, що є на ubuntu-latest
      - run: dotnet test --no-build

  connector-template:
    name: Connector Kit (dotnet new + build + test)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Проєкт із шаблону — поза репозиторієм, як у користувача: лише власні Directory.*.props і .editorconfig шаблону.
      - run: dotnet new install tools/connector-template
      - run: dotnet new openbp-connector -n Acme.Connector -o "$RUNNER_TEMP/acme"
      - run: dotnet build -warnaserror
        working-directory: ${{ runner.temp }}/acme
      - run: dotnet format --verify-no-changes --no-restore
        working-directory: ${{ runner.temp }}/acme
      - run: dotnet test --no-build
        working-directory: ${{ runner.temp }}/acme

  connectors:
    name: Конектори (build + format + test)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    strategy:
      fail-fast: false
      matrix:
        connector: [telegram, msgraph, onec, psy-support, kit-crm, http]
    defaults:
      run:
        working-directory: connectors/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build -warnaserror
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build

  psy-support-web:
    name: Адмінка psy-support (lint + test + build + e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openbp
          POSTGRES_USER: openbp
          POSTGRES_PASSWORD: openbp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbp -d openbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PSY_E2E_POSTGRES: Host=localhost;Port=5432;Username=openbp;Password=openbp
    defaults:
      run:
        working-directory: connectors/psy-support/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connectors/psy-support/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Збірка кладе SPA у wwwroot бекенду, e2e піднімає бекенд (`dotnet run --http`) і ходить у браузері.
      - run: npm run build
      - run: dotnet build ../src/OpenBP.Connectors.PsySupport
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psy-support-web-e2e
          path: |
            connectors/psy-support/web/playwright-report
            connectors/psy-support/web/test-results/screenshots
          retention-days: 7

  web:
    name: Angular lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # F4-13: веб-компонент <openbp-canvas> — збірка в один файл і Playwright на демо-сторінці.
      - run: npm run e2e:element
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-element
          retention-days: 7

  e2e-live:
    name: E2E (Api + Worker + браузер)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openbp
          POSTGRES_USER: openbp
          POSTGRES_PASSWORD: openbp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbp -d openbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=openbp;Username=openbp;Password=openbp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Кеш NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Api, Worker і FakeServer-моки запускаються з --no-build; dotnet-ef — для міграцій.
      - run: dotnet tool restore
      - run: dotnet build

      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e:live
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live
          path: apps/web/playwright-report-live
          retention-days: 7

  docker-images:
    name: Docker-образи (api, worker, migrate, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Лише збірка, без публікації (F4-09). Контекст — корінь репозиторію, див. .dockerignore.
      - name: Збірка образів
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          for image in api worker migrate web backup; do
            docker build -f "docker/${image}.Dockerfile" -t "openbp-${image}:ci" .
          done

      - name: Розміри образів
        run: |
          {
            echo '| Образ | Розмір |'
            echo '|---|---|'
            docker images --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' | grep 'openbp-'
          } >> "$GITHUB_STEP_SUMMARY"

  prod-smoke:
    name: Продакшн Compose (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # F4-10: docker-compose.prod.yml з випадковими секретами → /health/ready → вхід адміном → приклад success.
      - run: scripts/gen-env.sh
      - run: scripts/smoke-prod.sh
      # F4-11: сценарій + credential → бекап → видалення → відновлення → сценарій є, credential розшифровується.
      - run: scripts/smoke-backup.sh
      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v
