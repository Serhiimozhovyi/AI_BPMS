# Середовище розробки AI_BPMS: лише PostgreSQL (Api, воркер і web запускаються з dotnet/npm).
# Продакшн-розгортання з образами — docker-compose.prod.yml (README, «Продакшн»).
name: openbp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbp}
      POSTGRES_USER: ${POSTGRES_USER:-openbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
