# Середовище розробки OpenBP. Поки що лише PostgreSQL;
# сервіси api, worker, web додаються у фазах 2 і 4 (docs/roadmap.md).
name: openbp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbp}
      POSTGRES_USER: ${POSTGRES_USER:-openbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
